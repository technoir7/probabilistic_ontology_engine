[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probabilistic-ontology-engine"
version = "0.1.0"
description = "Domain-agnostic probabilistic ontology engine with three-level belief architecture"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
    "networkx>=3.0",
    # The code uses DiscreteBayesianNetwork (pgmpy 1.x); 1.3 removes APIs pgmpy
    # already warns about, so stay below it until checked.
    "pgmpy>=1.1,<1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "uvicorn>=0.22",
    "httpx>=0.24",
    "python-dotenv>=1.0",
    "yfinance>=0.2",
    "openai>=1.0",
]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hit real external APIs — skip in CI, run manually with -m live",
]
